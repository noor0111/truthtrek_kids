name: truthtrek_kids
description: TruthTrek Kids - Helps children check if news is true or fake.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.17.5

  sqflite: ^2.3.3
  path: ^1.9.0

  google_generative_ai: ^0.4.6
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true